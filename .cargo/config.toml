# 本仓库为 lib + bin。业务模块多为私有；默认让 `cargo doc` 包含内部模块。
# 默认让 `cargo doc` 包含内部模块，便于本地阅读与学习。
[build]
rustdocflags = ["--document-private-items"]

# Windows：用 rustc 自带的 LLD 替换 MSVC link.exe。
# 干净 release 的链接阶段通常能快一截，不影响 macOS。
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# 快捷：cargo docs  →  生成并打开（不含依赖文档）
[alias]
docs = "doc --no-deps --open"

# macOS：运行前 ad-hoc 签名，绑定嵌入的 Info.plist，定位授权弹窗才出得来。
[target.aarch64-apple-darwin]
runner = ["bash", "scripts/macos-run.sh"]

[target.x86_64-apple-darwin]
runner = ["bash", "scripts/macos-run.sh"]

