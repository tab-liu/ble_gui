[package]
name = "ble_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
btleplug = "0.11"
uuid = "1"
futures = "0.3"
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Devices_Bluetooth", "Foundation"] }

[build-dependencies]
slint-build = "1.17"
